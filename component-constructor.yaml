# yaml-language-server: $schema=https://ocm.software/schemas/configuration-schema.yaml

components:
  - name: github.com/openmcp-project/openmcp
    labels:
    - name: "org.opencontainers.image.source"
      value: "https://github.com/openmcp-project/openmcp"
    version: "${OPENMCP_VERSION}"
    provider:
      name: openmcp-project
    componentReferences:
      - componentName: github.com/openmcp-project/mcp-operator
        name: mcp-operator
        version: ${MCP_OPERATOR_VERSION}

      - componentName: github.com/openmcp-project/openmcp-operator
        name: openmcp-operator
        version: ${OPENMCP_OPERATOR_VERSION}

      - componentName: github.com/openmcp-project/gitops-templates
        name: gitops-templates
        version: ${GITOPS_TEMPLATES_VERSION}

      - componentName: github.com/openmcp-project/control-plane-operator
        name: control-plane-operator
        version: ${CONTROL_PLANE_OPERATOR_VERSION}

      - componentName: github.com/openmcp-project/platform-service-quota
        name: platform-service-quota
        version: ${PLATFORM_SERVICE_QUOTA_VERSION}

      - componentName: github.com/openmcp-project/bootstrapper
        name: bootstrapper
        version: ${BOOTSTRAPPER_VERSION}

      # Service Providers

      - componentName: github.com/openmcp-project/service-provider-landscaper
        name: service-provider-landscaper
        version: ${SERVICE_PROVIDER_LANDSCAPER_VERSION}

      - componentName: github.com/openmcp-project/service-provider-crossplane
        name: service-provider-crossplane
        version: ${SERVICE_PROVIDER_CROSSPLANE_VERSION}

      - componentName: github.com/openmcp-project/service-provider-external-secrets
        name: service-provider-external-secrets
        version: ${SERVICE_PROVIDER_EXTERNAL_SECRETS_VERSION}

      - componentName: github.com/openmcp-project/service-provider-flux
        name: service-provider-flux
        version: ${SERVICE_PROVIDER_FLUX_VERSION}

      - componentName: github.com/openmcp-project/service-provider-metrics-operator
        name: service-provider-metrics-operator
        version: ${SERVICE_PROVIDER_METRICS_OPERATOR_VERSION}

      - componentName: github.com/openmcp-project/service-provider-otel-operator
        name: service-provider-otel-operator
        version: ${SERVICE_PROVIDER_OTEL_OPERATOR_VERSION}

      - componentName: github.com/openmcp-project/service-provider-velero
        name: service-provider-velero
        version: ${SERVICE_PROVIDER_VELERO_VERSION}

      - componentName: github.com/open-component-model/service-provider-ocm
        name: service-provider-ocm
        version: ${SERVICE_PROVIDER_OCM_VERSION}

      - componentName: github.com/openmcp-project/service-provider-kro
        name: service-provider-kro
        version: ${SERVICE_PROVIDER_KRO_VERSION}

      - componentName: github.com/open-component-model/service-provider-odg
        name: service-provider-odg
        version: ${SERVICE_PROVIDER_ODG_VERSION}

      - componentName: github.com/openmcp-project/service-provider-kyverno
        name: service-provider-kyverno
        version: ${SERVICE_PROVIDER_KYVERNO_VERSION}

      - componentName: github.com/openmcp-project/service-provider-argocd
        name: service-provider-argocd
        version: ${SERVICE_PROVIDER_ARGOCD_VERSION}

      # Cluster Providers

      - componentName: github.com/openmcp-project/cluster-provider-gardener
        name: cluster-provider-gardener
        version: ${CLUSTER_PROVIDER_GARDENER_VERSION}

      - componentName: github.com/openmcp-project/cluster-provider-kind
        name: cluster-provider-kind
        version: ${CLUSTER_PROVIDER_KIND_VERSION}

      # Platform Services

      - componentName: github.com/openmcp-project/platform-service-dns
        name: platform-service-dns
        version: ${PLATFORM_SERVICE_DNS_VERSION}

      - componentName: github.com/openmcp-project/platform-service-gardener-ipam
        name: platform-service-gardener-ipam
        version: ${PLATFORM_SERVICE_GARDENER_IPAM_VERSION}

      - componentName: github.com/openmcp-project/platform-service-gateway
        name: platform-service-gateway
        version: ${PLATFORM_SERVICE_GATEWAY_VERSION}

      - componentName: github.com/openmcp-project/platform-service-test-runner
        name: platform-service-test-runner
        version: ${PLATFORM_SERVICE_TEST_RUNNER_VERSION}

      - componentName: github.com/openmcp-project/platform-service-project-workspace
        name: platform-service-project-workspace
        version: ${PLATFORM_SERVICE_PROJECT_WORKSPACE_VERSION}

      - componentName: github.com/openmcp-project/platform-service-resource-replicator
        name: platform-service-resource-replicator
        version: ${PLATFORM_SERVICE_RESOURCE_REPLICATOR_VERSION}

      - componentName: github.com/openmcp-project/usage-operator
        name: platform-service-usage
        version: ${PLATFORM_SERVICE_USAGE_VERSION}

      - componentName: github.com/openmcp-project/usage-operator
        name: platform-service-usagev2
        version: ${PLATFORM_SERVICE_USAGE_V2_VERSION}

      # observability-stack
      - componentName: github.com/openmcp-project/observability-stack
        name: observability-stack
        version: ${OBSERVABILITY_STACK_VERSION}

    resources: []
