name: Versioned Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # we need this to be able to push tags
  pull-requests: read # we need this to be able to read pull-requests body
  issues: read # we need this to be able to read pull-requests body
  packages: write # we need this to be able to push ocm packages
  attestations: write # we need this to be able to push ocm packages
  id-token: write # we need this to be able to push ocm packages

env:
  OCI_URL: ghcr.io/openmcp-project/components
  OCM_VERSION: v0.25.0
  OCM_COMPONENT: github.com/openmcp-project/openmcp

jobs:
  release_tag:
    name: Release version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.PUSH_KEY }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive

      - name: Read and validate VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-dev(-[0-9a-f]*)?)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Check if VERSION is already tagged
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ env.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.version }} already exists. Skipping release."
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi
          echo "Tag ${{ env.version }} doesn't exists. Proceeding with release."

      - name: Skip release if version is a dev version
        if: contains(env.version, '-dev')
        run: |
          echo "Skipping development version release: ${{ env.version }}"
          echo "SKIP=true" >> $GITHUB_ENV
          exit 0

      - name: Create Git tag
        if: ${{ env.SKIP != 'true' }}
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=format:'%an')
          AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "Tagging as $AUTHOR_NAME <$AUTHOR_EMAIL>"

          echo "AUTHOR_NAME=$AUTHOR_NAME" >> $GITHUB_ENV
          echo "AUTHOR_EMAIL=$AUTHOR_EMAIL" >> $GITHUB_ENV

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git tag -a "${{ env.version }}" -m "Release ${{ env.version }}"
          git push origin "${{ env.version }}"

      - name: setup OCM
        if: ${{ env.SKIP != 'true' }}
        run: |
          curl -fsSL "https://github.com/open-component-model/open-component-model/releases/download/${OCM_VERSION}/ocm-linux-amd64" --output "$RUNNER_TEMP/ocm"
          chmod +x "$RUNNER_TEMP/ocm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install cosign
        if: ${{ env.SKIP != 'true' }}
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4

      - name: Create OCM CTF
        if: ${{ env.SKIP != 'true' }}
        env:
          OPENMCP_VERSION: ${{ env.version }}
        run: |
          ocm add cv --config ocm-config.yaml \
            --constructor component-constructor.yaml \
            --repository ctf::openmcp-ctf

      - name: Sign OCM component
        if: ${{ env.SKIP != 'true' }}
        run: ocm sign cv --config ocm-config.yaml "ctf::openmcp-ctf//${OCM_COMPONENT}:${{ env.version }}"

      - name: Build Changelog
        if: ${{ env.SKIP != 'true' }}
        id: constructed_release
        run: |
          cat hack/release-body.tpl > RELEASE_BODY.md
          echo -e "## Components:\n" >> RELEASE_BODY.md
          ./hack/generate_release_notes.sh openmcp-ctf >> RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: ${{ env.SKIP != 'true' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ env.SKIP != 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CTF
        if: ${{ env.SKIP != 'true' }}
        run: |
          # ocm replaces existing versions and has no flag to prevent it.
          if ocm get cv "${OCI_URL}//${OCM_COMPONENT}:${{ env.version }}"; then
            echo "${OCM_COMPONENT}:${{ env.version }} already exists in ${OCI_URL}." >&2
            exit 1
          fi
          ocm transfer cv "ctf::openmcp-ctf//${OCM_COMPONENT}:${{ env.version }}" "${OCI_URL}"
